name: Feature request
description: Suggest a documentation, tooling, interaction, or animation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include affected rows and frame counts for animation changes.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Compatibility checks
      options:
        - label: The proposal preserves the Codex v2 1536x2288 contract.
        - label: The proposal does not include official copyrighted source images.
        - label: The proposal respects the character-asset licensing boundary.
